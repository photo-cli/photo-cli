name: preview
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9]"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        dotnet-version: 10.0.x

    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      # SonarScanner requires minimal version of 17, replacing the default 8 in ubuntu-latest
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'oracle'
        java-version: '21'

    - name: Install SonarCloud global tool
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Begin SonarCloud scan
      run: dotnet sonarscanner begin -d:sonar.qualitygate.wait=true /o:"photo-cli" /k:"photo-cli_photo-cli" /d:sonar.cs.opencover.reportsPaths="**/*.opencover.xml"  /d:sonar.token=${{secrets.SONAR_TOKEN}} /d:sonar.host.url="https://sonarcloud.io"
      env:
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}

    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION}

    - name: Test
      env:
        PHOTO_CLI_BIG_DATA_CLOUD_API_KEY: ${{secrets.PHOTO_CLI_BIG_DATA_CLOUD_API_KEY}}
        PHOTO_CLI_GOOGLE_MAPS_API_KEY: ${{secrets.PHOTO_CLI_GOOGLE_MAPS_API_KEY}}
        PHOTO_CLI_LOCATIONIQ_API_KEY: ${{secrets.PHOTO_CLI_LOCATIONIQ_API_KEY}}
      run: dotnet test --configuration Release /p:Version=${VERSION} --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    - name: End SonarCloud scan
      run: dotnet sonarscanner end /d:sonar.token=${{secrets.SONAR_TOKEN}}
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}

    - name: Pack
      run: dotnet pack --configuration Release /p:Version=${VERSION} --no-build --output .

    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish
      run: dotnet nuget push *.nupkg --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        platforms: linux/amd64,linux/arm64
        context: .
        push: true
        target: runtime
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/photocli:${{ env.VERSION }}
          ${{ secrets.DOCKERHUB_USERNAME }}/photocli:latest
